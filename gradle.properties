# Gradle needs headroom for Minecraft decompilation/remapping.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

# NOTE: Gradle 8.1.1 cannot parse class files from JDK 21+ ("Unsupported class file
# major version 65"). Gradle itself must run on JDK 17. That is machine-specific, so
# it lives in ~/.gradle/gradle.properties as org.gradle.java.home rather than here.

# Target platform
mc_version=1.20.1
forge_version=47.3.12

# Mod identity
mod_id=abyssalcraft
ac_version=2.0.0

# Integrations. JEI is compiled against; ProjectE is compileOnly.
jei_version=15.20.0.106
# CurseForge file id for ProjectE-1.20.1-PE1.0.1.jar
projecte_file_id=4901949
