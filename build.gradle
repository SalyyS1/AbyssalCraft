plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${ac_version}-mc${mc_version}"
group = 'com.shinoow.abyssalcraft'
base { archivesName = 'AbyssalCraft' }

java {
    // 1.20.1 runs on Java 17. Auto-provisioned via the foojay resolver in settings.gradle,
    // because no local JDK 17 is installed on this machine.
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: mc_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods { abyssalcraft { source sourceSets.main } }
        }
        client {
            property 'forge.enabledGameTestNamespaces', 'abyssalcraft'
        }
        server {
            property 'forge.enabledGameTestNamespaces', 'abyssalcraft'
            args '--nogui'
        }
        data {
            // Generates recipes, loot tables, tags and advancements that were
            // hardcoded in Java on 1.12.2 and must be datapack JSON on 1.20.1.
            workingDirectory project.file('run-data')
            args '--mod', 'abyssalcraft',
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // JEI: compile against the API only, run against the full mod.
    compileOnly    "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly    "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // ProjectE 1.20.1-PE1.0.1 is the last and only 1.20.1 Forge build.
    compileOnly fg.deobf("curse.maven:projecte-226410:${projecte_file_id}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProps = [
        mc_version   : mc_version,
        forge_version: forge_version,
        ac_version   : ac_version,
        mod_id       : mod_id
    ]
    inputs.properties replaceProps
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProps }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title'   : 'AbyssalCraft',
        'Specification-Vendor'  : 'Shinoow',
        'Specification-Version' : '1',
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor' : 'Shinoow'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
